<style>
/* ═══════════════════════════════════════════════════════════
   Design tokens
   ═══════════════════════════════════════════════════════════ */
:root{
  --bg:#f4f5fa;
  --surface:#ffffff;
  --surface-2:#fafbfe;
  --surface-3:#f1f3f9;
  --border:#e4e7f0;
  --border-strong:#d3d8e6;
  --text:#151a2d;
  --text-2:#5a6480;
  --text-3:#8b93aa;
  --primary:#4f46e5;
  --primary-soft:#eef0ff;
  --primary-strong:#3d34cc;
  --teal:#0d9488;
  --teal-soft:#e3f7f4;
  --amber:#d97706;
  --amber-soft:#fff5e6;
  --rose:#e11d48;
  --rose-soft:#ffe9ee;
  --sky:#0284c7;
  --sky-soft:#e6f3fc;
  --violet:#7c3aed;
  --shadow-sm:0 1px 2px rgba(20,25,50,.06);
  --shadow:0 4px 16px rgba(20,25,50,.07);
  --shadow-lg:0 18px 48px rgba(20,25,50,.16);
  --r-sm:8px; --r:12px; --r-lg:18px;
  --sidebar-w:264px;
  --topbar-h:62px;
  --font:'IBM Plex Sans Thai','Inter',-apple-system,'Segoe UI',sans-serif;
  --mono:'Inter',ui-monospace,'SF Mono',Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#0e1120;
  --surface:#161a2c;
  --surface-2:#1b2036;
  --surface-3:#222840;
  --border:#2a3150;
  --border-strong:#3a4268;
  --text:#eef1fa;
  --text-2:#a8b1cc;
  --text-3:#7b85a3;
  --primary:#7c74ff;
  --primary-soft:#242455;
  --primary-strong:#9a93ff;
  --teal-soft:#0f3d38;
  --amber-soft:#40310f;
  --rose-soft:#43162a;
  --sky-soft:#10314a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 4px 18px rgba(0,0,0,.35);
  --shadow-lg:0 20px 50px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14.5px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important}
.muted{color:var(--text-2)}
.dim{color:var(--text-3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:var(--primary);text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.35;font-weight:600}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ═══════════════ splash ═══════════════ */
.splash{position:fixed;inset:0;display:grid;place-items:center;background:
  radial-gradient(1000px 500px at 20% 0%,#eceaff 0%,transparent 60%),
  radial-gradient(900px 500px at 100% 100%,#e2f6f3 0%,transparent 60%),var(--bg);z-index:100}
.splash-card{text-align:center}
.splash-logo{width:72px;height:72px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;
  overflow:hidden;background:transparent;padding:0}
.splash-logo .app-logo{width:100%;height:100%;object-fit:contain;display:block}
.splash-title{font-size:19px;font-weight:600;margin-bottom:18px}
.splash-bar{width:190px;height:4px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin:0 auto}
.splash-bar span{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#6366f1,#8b5cf6);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.splash-note{margin-top:14px;font-size:13px;color:var(--text-2)}

/* ═══════════════ layout ═══════════════ */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;z-index:40;
}
.brand{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid var(--border)}
.brand-logo{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  overflow:hidden;background:transparent;padding:0}
.brand-logo .app-logo{width:100%;height:100%;object-fit:contain;display:block}
.brand-text{min-width:0;flex:1}
.brand-text strong{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{display:block;font-size:11.5px;color:var(--text-3)}
.sidebar .sidebar-close{display:none}

.nav{flex:1;min-height:0;overflow:hidden;padding:12px 10px 8px;
  display:flex;flex-direction:column;gap:2px}
.nav-fixed{flex:0 0 auto}
.nav-budgets-section{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:2px}
.nav-group-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-3);padding:14px 10px 6px;flex:0 0 auto;display:flex;align-items:center;gap:8px}
.nav-budgets-section > .nav-group-label{padding-top:10px}
.nav-count{font-size:10.5px;font-weight:600;letter-spacing:0;text-transform:none;
  color:var(--text-3);background:var(--surface-3);border-radius:99px;padding:1px 7px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);
  color:var(--text-2);font-size:13.8px;font-weight:500;cursor:pointer;transition:.14s;margin-bottom:2px}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item .ni{width:18px;text-align:center;font-size:13px;opacity:.85}
.nav-budgets{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
  padding-right:2px;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable}
.nav-budgets .nav-item{align-items:flex-start;justify-content:flex-start;gap:10px;padding-top:8px;padding-bottom:8px}
.nav-bcode{width:22px;height:22px;flex:0 0 22px;border-radius:6px;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:#94a3b8;color:#fff;margin-top:1px}
.nav-bcode.st-new{background:#7dd3fc;color:#0c4a6e}
.nav-bcode.st-process{background:#34d399;color:#064e3b}
.nav-bcode.st-closed{background:#cbd5e1;color:#475569}
.nav-item.active .nav-bcode{box-shadow:0 0 0 2px var(--primary)}
.nav-bname{flex:1;min-width:0;white-space:normal;overflow:visible;text-overflow:unset;
  line-height:1.35;word-break:break-word}

.sidebar-foot{border-top:1px solid var(--border);padding:12px 14px;flex:0 0 auto;position:relative;z-index:45}
.admin-menu-wrap{position:relative}
.user-chip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:0;padding:0;font:inherit;color:inherit}
.user-chip-btn{border-radius:12px;padding:8px;margin:-8px;cursor:default;
  transition:background .14s}
.user-chip-btn.is-admin{cursor:pointer}
.user-chip-btn.is-admin:hover,.user-chip-btn.is-admin[aria-expanded="true"]{background:var(--surface-3)}
.admin-caret{margin-left:auto;flex:0 0 auto;font-size:11px;color:var(--text-3);line-height:1;
  transition:transform .15s}
.user-chip-btn[aria-expanded="true"] .admin-caret{transform:rotate(180deg)}
.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;
  font-weight:600;font-size:13px;color:#fff;background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.user-meta{min-width:0;flex:1}
.user-meta strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.user-meta small{font-size:11.5px;color:var(--text-3)}
.version{font-size:11px;color:var(--text-3);margin-top:9px}

/* เมนูผู้ดูแล — เปิดขึ้นด้านบนเสมอ (trigger อยู่ท้าย sidebar) */
.admin-menu{
  position:absolute;left:0;right:0;bottom:calc(100% + 8px);
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow-lg, 0 18px 40px rgba(15,23,42,.18));
  padding:8px;z-index:60;max-height:min(320px, calc(100vh - 120px));overflow-y:auto
}
.admin-menu.hidden{display:none}
.admin-menu-title{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);padding:6px 10px 8px}
.admin-menu-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;
  color:var(--text-2);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px}
.admin-menu-item:hover{background:var(--surface-3);color:var(--text)}
.admin-menu-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.admin-menu-item .ni{width:18px;text-align:center;font-size:13px;opacity:.85}
.admin-menu-item.hidden{display:none !important}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 22px;
  background:var(--surface);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.crumbs{flex:1;min-width:0;font-size:13.5px;color:var(--text-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumbs b{color:var(--text);font-weight:600}
.crumbs .sep{color:var(--text-3)}
.topbar-actions{display:flex;gap:8px}
.topbar .menu-btn{display:none}
.view{flex:1;padding:22px;max-width:1460px;width:100%;margin:0 auto}
.foot{padding:14px 22px 26px;text-align:center;font-size:12px;color:var(--text-3)}
.sidebar-backdrop{display:none}

@media(max-width:1000px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.22s ease;box-shadow:var(--shadow-lg)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(10,12,25,.45);z-index:35}
  .sidebar .sidebar-close{display:grid}
  .topbar .menu-btn{display:grid}
  .view{padding:16px}
  .topbar{padding:0 14px}
}

/* ═══════════════ buttons ═══════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
  border-radius:9px;padding:8px 14px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:.15s;white-space:nowrap;background:var(--surface-3);color:var(--text)}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.28)}
.btn-primary:hover{background:var(--primary-strong)}
.btn-teal{background:var(--teal);color:#fff}
.btn-danger{background:var(--rose);color:#fff}
.btn-outline{background:transparent;border-color:var(--border-strong);color:var(--text-2)}
.btn-outline:hover{background:var(--surface-3);color:var(--text)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-3);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn-block{width:100%}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:none;border-radius:9px;
  background:transparent;color:var(--text-2);font-size:16px;cursor:pointer;transition:.15s;font-family:inherit}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}

/* ═══════════════ cards & grid ═══════════════ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:15px}
.card-head .sub{font-size:12.5px;color:var(--text-3);margin-top:2px}
.card-body{padding:18px}
.card-body.tight{padding:0}
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
@media(max-width:1200px){.g-4{grid-template-columns:repeat(2,1fr)}.g-2-1{grid-template-columns:1fr}}
@media(max-width:760px){.g-4,.g-3,.g-2{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.mt{margin-top:16px}

/* page header */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:21px;font-weight:650}
.page-head p{margin:4px 0 0;font-size:13.5px;color:var(--text-2)}

/* ═══════════════ KPI ═══════════════ */
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 17px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary);opacity:.85}
.kpi.teal::after{background:var(--teal)} .kpi.amber::after{background:var(--amber)}
.kpi.rose::after{background:var(--rose)} .kpi.sky::after{background:var(--sky)} .kpi.violet::after{background:var(--violet)}
.kpi-label{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:6px;font-weight:500}
.kpi-value{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.kpi-value small{font-size:13px;font-weight:500;color:var(--text-3);margin-left:3px}
.kpi-sub{font-size:12px;color:var(--text-3);margin-top:5px}

/* progress */
.bar{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden;display:flex}
.bar span{display:block;height:100%;transition:width .5s cubic-bezier(.22,1,.36,1)}
.bar .seg-res{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar .seg-dis{background:linear-gradient(90deg,#4f46e5,#7c74ff)}
.bar-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:9px}
.bar-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.pill-primary{background:var(--primary-soft);color:var(--primary)}
.pill-teal{background:var(--teal-soft);color:var(--teal)}
.pill-amber{background:var(--amber-soft);color:var(--amber)}
.pill-rose{background:var(--rose-soft);color:var(--rose)}
.pill-sky{background:var(--sky-soft);color:var(--sky)}
.pill-dot::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

/* ═══════════════ budget card ═══════════════ */
.bcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:18px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.18s;display:flex;flex-direction:column;gap:13px}
.bcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border-strong)}
.bcard-top{display:flex;align-items:flex-start;gap:12px}
.bcode{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:grid;place-items:center;
  font-size:17px;font-weight:700;color:#fff;background:#94a3b8}
.bcode.st-new{background:#7dd3fc;color:#0c4a6e}
.bcode.st-process{background:#34d399;color:#064e3b}
.bcode.st-closed{background:#cbd5e1;color:#475569}
.pill-new{background:#e0f2fe;color:#0369a1}
.pill-process{background:#d1fae5;color:#047857}
.pill-closed{background:#e2e8f0;color:#64748b}
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border-radius:50%;font-size:10px;font-weight:700;font-style:normal;
  background:var(--surface-3);color:var(--text-2);cursor:help;margin-left:4px;vertical-align:middle}
.tip:hover,.tip:focus{background:var(--primary-soft);color:var(--primary)}
.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);
  transform:translateX(-50%);width:max-content;max-width:260px;padding:8px 10px;border-radius:8px;
  background:#1e293b;color:#f8fafc;font-size:12px;font-weight:500;line-height:1.4;
  opacity:0;pointer-events:none;transition:opacity .15s;z-index:50;white-space:normal;text-align:left}
.tip:hover::after,.tip:focus::after{opacity:1}
.msel{border:1px solid var(--border);border-radius:10px;padding:8px;max-height:140px;overflow:auto;
  background:var(--surface);display:flex;flex-direction:column;gap:4px}
.msel label{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 6px;border-radius:6px;cursor:pointer}
.msel label:hover{background:var(--surface-2)}
.msel input{margin:0}
.dash-filters{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-start}
.dash-filter-group{min-width:0}
.dash-filter-label{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px}
.dash-filter-actions{margin-left:auto;align-self:flex-end}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;
  border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:500;
  color:var(--text-2);cursor:pointer;user-select:none}
.chip input{margin:0;accent-color:var(--primary)}
.chip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}
.bcard h4{font-size:14.5px}
.bcard .bmeta{font-size:12px;color:var(--text-3);margin-top:2px}
.bnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:4px}
.bnum-label{font-size:11px;color:var(--text-3)}
.bnum-value{font-size:14px;font-weight:650;margin-top:1px}

/* ═══════════════ table ═══════════════ */
.table-wrap{overflow-x:auto;border-radius:0 0 var(--r-lg) var(--r-lg)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.4px}
table.tbl th{text-align:left;padding:10px 14px;font-size:11.5px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:var(--text-3);background:var(--surface-2);
  border-bottom:1px solid var(--border);position:sticky;top:0;white-space:nowrap}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tbody tr:last-child td{border-bottom:none}
table.tbl .r{text-align:right;white-space:nowrap}
table.tbl .c{text-align:center}
.t-title{font-weight:600}
.t-sub{font-size:11.8px;color:var(--text-3);margin-top:2px}
.t-actions{display:flex;gap:5px;justify-content:flex-end}
.cancelled td{opacity:.5}
.cancelled .t-title{text-decoration:line-through}

/* empty / loading */
.empty{padding:46px 20px;text-align:center;color:var(--text-3)}
.empty-ico{font-size:34px;opacity:.35;margin-bottom:8px}
.empty h4{font-size:14.5px;color:var(--text-2);font-weight:600}
.empty p{margin:5px 0 0;font-size:13px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 37%,var(--surface-3) 63%);
  background-size:400% 100%;animation:shine 1.3s linear infinite}
@keyframes shine{0%{background-position:100% 0}100%{background-position:0 0}}

/* ═══════════════ tabs ═══════════════ */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;padding:0 4px}
.tab{padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--text-2);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab .cnt{font-size:11px;background:var(--surface-3);border-radius:99px;padding:1px 6px;margin-left:5px;color:var(--text-3)}

/* ═══════════════ forms ═══════════════ */
.field{margin-bottom:15px}
.field > label{display:block;font-size:12.8px;font-weight:600;margin-bottom:6px;color:var(--text-2)}
.field .req{color:var(--rose)}
.field .hint{font-size:11.8px;color:var(--text-3);margin-top:5px;line-height:1.5}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{
  width:100%;padding:9px 12px;border:1px solid var(--border-strong);border-radius:9px;
  font-family:inherit;font-size:13.8px;background:var(--surface);color:var(--text);transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea{resize:vertical;min-height:74px;line-height:1.6}
input.money{font-family:var(--mono);font-weight:600;text-align:right;font-size:15px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.field-row{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;background:var(--surface-3);padding:4px;border-radius:11px}
.seg button{flex:1;padding:9px 10px;border:none;border-radius:8px;background:transparent;font-family:inherit;
  font-size:13.3px;font-weight:600;color:var(--text-2);cursor:pointer;transition:.15s}
.seg button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}
.check{display:flex;align-items:flex-start;gap:9px;font-size:13.3px;cursor:pointer}
.check input{margin-top:3px;width:auto}

/* file upload */
.drop{border:1.5px dashed var(--border-strong);border-radius:var(--r);padding:18px;text-align:center;
  cursor:pointer;transition:.15s;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop-ico{font-size:22px;opacity:.5}
.drop p{margin:6px 0 0;font-size:13px;color:var(--text-2)}
.drop small{color:var(--text-3);font-size:11.5px}
.file-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.file-item{display:flex;align-items:center;gap:9px;padding:7px 10px;background:var(--surface-3);
  border-radius:8px;font-size:12.8px}
.file-item .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .fsize{color:var(--text-3);font-size:11.5px}
.attach-link{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;background:var(--surface-3);
  border-radius:7px;font-size:11.8px;color:var(--text-2);cursor:pointer;margin:2px 4px 2px 0;max-width:230px}
.attach-link:hover{background:var(--primary-soft);color:var(--primary)}
.attach-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* callout */
.callout{display:flex;gap:11px;padding:12px 14px;border-radius:var(--r);font-size:13px;line-height:1.6;background:var(--sky-soft);color:var(--text)}
.callout.warn{background:var(--amber-soft)}
.callout.danger{background:var(--rose-soft)}
.callout.ok{background:var(--teal-soft)}
.callout .ci{font-size:15px;line-height:1.3}

/* ═══════════════ drawer / modal ═══════════════ */
.drawer-wrap,.modal-wrap{position:fixed;inset:0;z-index:60}
.drawer-backdrop,.modal-backdrop{position:absolute;inset:0;background:rgba(10,12,25,.42);backdrop-filter:blur(2px);animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--surface);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slideIn .25s cubic-bezier(.22,1,.36,1)}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:17px 20px;border-bottom:1px solid var(--border)}
.drawer-head h3{font-size:16px}
.drawer-head p{margin:3px 0 0;font-size:12.5px}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;background:var(--surface-2)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,94vw);
  max-height:86vh;background:var(--surface);border-radius:var(--r-lg);display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);animation:pop .2s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px}
.modal-body{padding:20px;overflow-y:auto}

/* ═══════════════ toast ═══════════════ */
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:380px}
.toast{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--surface);
  border:1px solid var(--border);box-shadow:var(--shadow-lg);font-size:13.3px;animation:toastIn .22s ease;
  border-left:4px solid var(--primary)}
.toast.ok{border-left-color:var(--teal)}
.toast.err{border-left-color:var(--rose)}
.toast.warn{border-left-color:var(--amber)}
.toast strong{display:block;font-size:13.3px;margin-bottom:1px}
.toast p{margin:0;font-size:12.6px;color:var(--text-2);white-space:pre-line}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* ═══════════════ charts ═══════════════ */
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{position:relative;width:150px;height:150px;flex:0 0 150px}
.donut svg{transform:rotate(-90deg)}
.donut-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut-center b{display:block;font-size:19px;font-weight:700}
.donut-center small{font-size:11px;color:var(--text-3)}
.legend{flex:1;min-width:170px;display:flex;flex-direction:column;gap:9px}
.legend-row{display:flex;align-items:center;gap:9px;font-size:12.8px}
.legend-row i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.legend-row .lv{margin-left:auto;font-weight:650}
.chart-bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px;overflow-x:auto}
.cbar{flex:1;min-width:38px;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.cbar-stack{width:100%;max-width:44px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;flex:1}
.cbar-seg{border-radius:5px 5px 0 0;min-height:2px;transition:height .4s ease}
.cbar-seg.res{background:linear-gradient(180deg,#fbbf24,#f59e0b)}
.cbar-seg.dis{background:linear-gradient(180deg,#7c74ff,#4f46e5);border-radius:0 0 5px 5px}
.cbar-label{font-size:10.5px;color:var(--text-3);white-space:nowrap}

/* timeline */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item::before{content:'';position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;
  background:var(--surface);border:2.5px solid var(--primary)}
.tl-item.amber::before{border-color:var(--amber)}
.tl-item.rose::before{border-color:var(--rose)}
.tl-item.teal::before{border-color:var(--teal)}
.tl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.3px}
.tl-time{font-size:11.5px;color:var(--text-3)}
.tl-body{font-size:12.8px;color:var(--text-2);margin-top:3px}
.diff{display:flex;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:12px}
.diff-box{flex:1;min-width:170px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 11px}
.diff-box h5{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);margin-bottom:5px}
.diff-box code{font-family:var(--mono);font-size:11.5px;color:var(--text-2);display:block;white-space:pre-wrap;word-break:break-word}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .field{margin-bottom:0;min-width:140px;flex:1}
.filters .field.narrow{max-width:150px}


/* ═══════════════ user manual overlay + print A4 ═══════════════ */
.manual-overlay{position:fixed;inset:0;z-index:80;background:var(--bg);
  display:flex;flex-direction:column}
.manual-overlay.hidden{display:none !important}
.manual-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 18px;border-bottom:1px solid var(--border);background:var(--surface);flex:0 0 auto}
.manual-toolbar-left{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.manual-toolbar-left strong{font-size:15px}
.manual-toolbar-right{display:flex;gap:8px;flex-wrap:wrap}
.manual-scroll{flex:1;min-height:0;overflow:auto;padding:20px 16px 40px}

.manual{max-width:210mm;margin:0 auto;background:#fff;color:#1e293b;
  border:1px solid var(--border);border-radius:16px;padding:28px 32px 40px;
  box-shadow:var(--shadow-sm);font-size:13.5px;line-height:1.65}
.manual h1{font-size:26px;line-height:1.25;margin:0 0 8px;font-weight:700;color:#0f172a}
.manual h2{font-size:17px;margin:28px 0 10px;padding-bottom:6px;border-bottom:2px solid #0d7377;color:#0f172a;page-break-after:avoid}
.manual h3{font-size:14.5px;margin:16px 0 8px;color:#134e4a;page-break-after:avoid}
.manual p,.manual li{margin:0 0 8px}
.manual ul,.manual ol{margin:0 0 12px;padding-left:1.25em}
.manual-cover{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid #e2e8f0}
.manual-cover-brand{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.manual-cover-logo{width:72px;height:72px;border-radius:16px;object-fit:contain;background:transparent;flex:0 0 auto}
.manual-kicker{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#0d7377}
.manual-sub{margin:0;color:#64748b;font-size:13px}
.manual-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.manual-meta div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px}
.manual-meta dt{font-size:11px;font-weight:600;color:#64748b;margin:0 0 4px}
.manual-meta dd{margin:0;font-size:12.5px;color:#0f172a}
.manual-toc{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:14px 18px;margin-bottom:8px}
.manual-toc h2{margin-top:0;border:0;padding:0;font-size:15px}
.manual-toc ol{margin:8px 0 0;columns:2;column-gap:24px}
.manual-toc a{color:#0f766e;text-decoration:none}
.manual-toc a:hover{text-decoration:underline}
.manual table{width:100%;border-collapse:collapse;margin:10px 0 16px;font-size:12.8px;page-break-inside:avoid}
.manual th,.manual td{border:1px solid #e2e8f0;padding:8px 10px;text-align:left;vertical-align:top}
.manual th{background:#f1f5f9;font-weight:600;color:#334155}
.manual-callout{border-left:4px solid #0d7377;background:#f0fdfa;padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0}
.manual-callout.warn{border-left-color:#d97706;background:#fffbeb}
.manual .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:#e2e8f0;color:#334155}
.manual .tag-admin{background:#dbeafe;color:#1e40af}
.manual .tag-exec{background:#e0f2fe;color:#075985}
.manual-rules .rules{padding-left:1.2em}
.manual-rules .rules li{margin-bottom:10px;page-break-inside:avoid}
.manual-end{margin-top:28px;padding-top:16px;border-top:1px solid #e2e8f0;text-align:center;color:#64748b;font-size:12.5px}
.manual-end .muted{margin:4px 0 0}

@media (max-width:720px){
  .manual{padding:18px 16px 28px;border-radius:12px}
  .manual-meta{grid-template-columns:1fr}
  .manual-toc ol{columns:1}
  .manual-cover-brand{flex-direction:column;align-items:flex-start}
}

/* พิมพ์ A4 */
@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  html,body{background:#fff !important}
  body.manual-print-mode .shell,
  body.manual-print-mode .splash,
  body.manual-print-mode .drawer-wrap,
  body.manual-print-mode .modal-wrap,
  body.manual-print-mode .toasts,
  body.manual-print-mode .sidebar-backdrop{display:none !important}
  body.manual-print-mode .manual-overlay{position:static;display:block !important;background:#fff;inset:auto;height:auto;overflow:visible}
  body.manual-print-mode .manual-toolbar,
  body.manual-print-mode .no-print{display:none !important}
  body.manual-print-mode .manual-scroll{overflow:visible;padding:0}
  body.manual-print-mode .manual{
    max-width:none;margin:0;border:0;border-radius:0;box-shadow:none;padding:0;
    color:#000;font-size:11.5pt;line-height:1.5
  }
  body.manual-print-mode .manual h1{font-size:20pt}
  body.manual-print-mode .manual h2{font-size:13pt;border-bottom-color:#0d7377}
  body.manual-print-mode .manual a{color:inherit;text-decoration:none}
  body.manual-print-mode .manual-toc{break-inside:avoid}
  body.manual-print-mode .manual section{break-inside:auto}
  body.manual-print-mode .manual table{break-inside:avoid}
}
